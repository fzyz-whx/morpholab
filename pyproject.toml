[project]
name = "morpholab"
version = "0.0.1"
description = "Research tools for wound-closure morphodynamics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "pillow>=11,<13",
    "tifffile>=2025.1,<2027",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.2,<7",
    "fastapi>=0.156.8",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
cpu = ["torch==2.11.0"]
cuda = ["torch==2.11.0"]
reports = ["matplotlib>=3.10,<4"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/morpholab_ml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "scripts/check_docs.py",
    "scripts/verify_remote.py",
    "ml/morpholab_ml/data/schema.py",
    "ml/morpholab_ml/data/preparation.py",
    "ml/morpholab_ml/evaluation/metrics.py",
    "ml/morpholab_ml/baselines/geometric.py",
]
