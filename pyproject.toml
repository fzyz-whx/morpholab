[project]
name = "morpholab"
version = "0.0.1"
description = "Research tools for wound-closure morphodynamics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "pillow>=11,<13",
    "tifffile>=2025.1,<2027",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/morpholab_ml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts/check_docs.py", "scripts/verify_remote.py", "ml/morpholab_ml/data/schema.py"]
